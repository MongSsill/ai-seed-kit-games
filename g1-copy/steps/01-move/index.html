<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>길 건너기 (완전 카피 연습)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1b1f2a;
      color: #f2f2f2;
      font-family: sans-serif;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      background: #3a7d3a;
      box-shadow: 0 0 0 4px #10131a;
      max-width: 100vw;
      max-height: 100vh;
    }
    .help {
      margin-top: 8px;
      font-size: 14px;
      color: #c9c9c9;
    }
  </style>
</head>
<body>
  <canvas id="game" width="432" height="672"></canvas>
  <div class="help">방향키 또는 WASD 로 한 칸씩 움직입니다. 위로 갈수록 기록이 오릅니다.</div>
  <script src="./game.js"></script>
</body>
</html>
