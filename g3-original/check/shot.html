<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<!-- 검사용 장면 찍기: shot.html?scene=이름. 화면 없는 크롬으로 찍는다 -->
<canvas id="game" width="960" height="544"></canvas>
<script>window.G3_TEST = true; window.G3_SHOT = true;</script>
<script src="../game.js"></script>
<script>
(function () {
  var g3 = window.G3, TS = g3.TS, sc = (location.search.match(/scene=([^&]+)/) || [])[1] || 'a';
  function sim(s) { for (var i = 0; i < Math.round(s * 60); i++) g3.update(1 / 60); }
  function put(col, row) { var p = g3.P; p.x = col * TS + 4; p.y = (row + 1) * TS - p.h; p.vx = 0; p.vy = 0; g3.G.cam = Math.max(0, p.x - 400); }
  if (sc === 'gap') { g3.startLevel(0, { test: true }); put(25, 13); g3.press('right'); sim(0.35); g3.press('jump'); sim(0.25); g3.tag(1); sim(0.25); }
  if (sc === 'wall' || sc === 'wall-ground') {
    g3.startLevel(0, { test: true }); put(63, 13);
    g3.press('up'); g3.tag(1); sim(0.45); g3.release('up');
    if (sc === 'wall') { g3.press('jump'); sim(0.2); }
    else if (!g3.P.onGround) throw new Error('Expected blue to stand on the ice pillar');
  }
  if (sc === 'perfect') { g3.startLevel(1, { test: true }); put(29, 13); g3.P.char = 1; g3.P.face = 1; g3.G.enemies.forEach(function (e) { if (e.type === 'g' && e.x < 40 * TS) { e.x = 32 * TS; } }); g3.tag(0); var t = 0; while (!g3.G.perfect && t < 40) { g3.update(1 / 60); t++; } sim(0.05); g3.tag(2); sim(0.08); }
  if (sc === 'relic2') { g3.startLevel(4, { test: true }); put(60, 13); g3.P.inv = 99; sim(0.2); var bb6 = g3.G.enemies.filter(function (e) { return e.type === 'B'; })[0]; bb6.hp = 0; sim(1.2); g3.G.hp = 2; var ch6 = g3.G.items.filter(function (i) { return i.type === 'C'; })[0]; g3.P.x = ch6.x; g3.P.y = ch6.y + ch6.h - g3.P.h; sim(0.05); g3.press('up'); g3.update(1 / 60); g3.release('up'); sim(2.6); }
  if (sc === 'door11') { g3.startLevel(0, { test: true }); var dd = g3.G.door; g3.P.x = dd.x - 6; g3.P.y = dd.y + dd.h - g3.P.h; g3.G.cam = g3.P.x - 400; sim(1.5); var q2 = new URLSearchParams(location.search); if (q2.get('open')) { g3.press('up'); g3.update(1 / 60); g3.release('up'); sim(+q2.get('open')); } }
  if (sc === 'boss5') { var q3 = new URLSearchParams(location.search); g3.startLevel(4, { test: true }); put(60, 13); g3.P.inv = 99; sim(0.2); var bb5 = g3.G.enemies.filter(function (e) { return e.type === 'B'; })[0]; bb5.hp = 0; sim(1.2);
    var ch5 = g3.G.items.filter(function (i) { return i.type === 'C'; })[0]; if (q3.get('chest')) { g3.P.x = ch5.x; g3.P.y = ch5.y + ch5.h - g3.P.h; sim(0.05); g3.press('up'); g3.update(1 / 60); g3.release('up'); sim(+q3.get('chest')); }
    if (q3.get('door')) { g3.G.relicPop = null; var d5 = g3.G.door; g3.P.x = d5.x + 4; g3.P.y = d5.y + d5.h - g3.P.h; g3.G.cam = g3.P.x - 420; sim(0.3); if (+q3.get('door') > 0) { g3.press('up'); g3.update(1 / 60); g3.release('up'); sim(+q3.get('door')); } } }
  if (sc === 'ultt') { var qq = new URLSearchParams(location.search); g3.startLevel(3, { test: true }); put(84, 13); g3.G.gauge = 100; g3.press('ult'); sim(+(qq.get('t') || 0.8)); }
  if (sc === 'start11') { g3.startLevel(0, { test: true }); put(4, 13); sim(0.5); }
  if (sc === 'start14') { g3.startLevel(3, { test: true }); put(5, 13); sim(0.5); }
  if (sc === 'ready') { g3.startLevel(3, { test: true }); put(84, 13); g3.G.gauge = 100; sim(+(new URLSearchParams(location.search).get('t') || 0.5)); }
  if (sc === 'selfcd') { g3.startLevel(1, { test: true }); put(12, 13); g3.P.char = 1; g3.P.face = 1; g3.tag(1); sim(0.6); g3.tag(1); sim(0.05); }
  if (sc === 'walkc') { var q = new URLSearchParams(location.search); g3.startLevel(1, { test: true }); put(8, 13); g3.P.char = +(q.get('ch') || 0); g3.press('right'); sim(+(q.get('t') || 0.3)); g3.G.cam = g3.P.x - 480; }
  if (sc === 'atkform') { g3.startLevel(1, { test: true }); put(12, 13); g3.G.form = 'atk'; g3.G.stack = 1; g3.G.regen = 1.2; sim(0.05); }
  if (sc === 'walk' || sc === 'walk2') { g3.startLevel(4, { test: true }); put(52, 13); g3.P.inv = 99; sim(1.3); g3.P.x = 50 * TS; sim(sc === 'walk' ? 0.35 : 0.5); }
  if (sc === 'counter') { g3.startLevel(4, { test: true }); put(52, 13); g3.P.inv = 99; sim(0.1); var cb = g3.G.enemies.filter(function (e) { return e.type === 'B'; })[0]; var t = 0; while (!(cb.state === 'tele' && cb.st > 0.6) && t < 600) { g3.update(1 / 60); t++; } g3.P.x = cb.x - 140; g3.tag(1); sim(0.1); }
  if (sc === 'treasure') { g3.startLevel(0, { test: true }); var it = g3.G.items.filter(function (i) { return i.type === 'T'; })[0]; g3.P.x = it.x; g3.P.y = it.y; sim(0.25); }
  if (sc === 'hit') { g3.startLevel(1, { test: true }); put(29, 13); g3.P.char = 1; g3.P.face = 1; g3.G.enemies.forEach(function (e) { if (e.type === 'g' && e.x < 40 * TS) { e.x = 32 * TS; } }); g3.tag(0); var t = 0; while (!g3.G.perfect && t < 40) { g3.update(1 / 60); t++; } sim(0.05); g3.tag(2); sim(0.07); }
  if (sc === 'slam' || sc === 'wave') { g3.startLevel(4, { test: true }); put(52, 13); g3.P.inv = 99; sim(1.2); var bb = g3.G.enemies.filter(function (e) { return e.type === 'B'; })[0]; var t = 0; while (!(bb.state === (sc === 'slam' ? 'slam' : 'wave')) && t < 3000) { g3.update(1 / 60); t++; } sim(sc === 'slam' ? 0.3 : 0.5); }
  if (sc === 'chain') { g3.startLevel(0, { test: true }); put(8, 13); g3.P.face = 1; g3.tag(0); sim(0.23); }
  if (sc === 'cutin') { g3.startLevel(1, { test: true }); put(29, 13); g3.P.char = 1; g3.P.face = 1; g3.G.enemies.forEach(function (e) { if (e.type === 'g' && e.x < 40 * TS) { e.x = 32 * TS; } }); g3.tag(0); var t = 0; while (!g3.G.perfect && t < 40) { g3.update(1 / 60); t++; } sim(0.05); g3.tag(2); sim(0.22); }
  if (sc === 'cue') { g3.startLevel(1, { test: true }); put(29, 13); g3.P.char = 1; g3.P.face = 1; g3.G.enemies.forEach(function (e) { if (e.type === 'g' && e.x < 40 * TS) { e.x = 32 * TS; } }); g3.tag(0); var t = 0; while (!g3.G.perfect && t < 40) { g3.update(1 / 60); t++; } sim(0.05); }
  if (sc === 'l3') { g3.startLevel(2, { test: true }); put(31, 6); sim(0.1); }
  if (sc === 'l4') { g3.startLevel(3, { test: true }); put(84, 13); g3.G.gauge = 100; sim(0.1); }
  if (sc === 'ult') { g3.startLevel(3, { test: true }); put(84, 13); g3.G.gauge = 100; g3.press('ult'); sim(0.8); }
  if (sc === 'dash') { g3.startLevel(0, { test: true }); put(44, 13); g3.P.char = 1; g3.P.face = 1; g3.tag(0); sim(0.12); }
  if (sc === 'wind') { g3.startLevel(1, { test: true }); put(5, 13); g3.P.face = 1; g3.tag(2); sim(0.12); }
  if (sc === 'atk') { g3.startLevel(1, { test: true }); put(31, 13); g3.P.face = 1; g3.press('form'); g3.update(1/60); g3.release('form'); g3.tag(1); sim(0.15); }
  if (sc === 'boss') { g3.startLevel(4, { test: true }); put(52, 13); g3.P.inv = 9; sim(0.1); sim(2.4); }
  if (sc === 'boss2') { g3.startLevel(4, { test: true }); put(52, 13); g3.P.inv = 9; sim(0.1); sim(3.3); }
  setTimeout(function () { for (var i = 0; i < 30; i++) g3.draw(); if (/guide=1/.test(location.search) && g3.G.ult && g3.G.ult.base) { var cx = document.getElementById('game').getContext('2d'); cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#ff00ff'; cx.fillRect(479, 0, 2, 544); cx.fillStyle = '#00ffff'; cx.fillRect(0, g3.G.ult.base - 4, 960, 1); } }, 400);   // guide=1: 화면 정가운데 선(분홍)과 캐릭터가 딛는 바닥 선(하늘)
})();
</script></body></html>
