<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chain Echo (가칭) — 게임 3 데모</title>
<style>
  /* 2026-11-24 사용자 "게임 로비 화면 및 일시정지 화면도 톤앤매너에 맞게": 게임 안 HUD 와 같은 남색 판·청동 테두리·금 글씨·수정 보석 */
  :root { --bg:#0a0d18; --panel:rgba(12,16,32,0.9); --rim:#7a5a2a; --gold:#e2bd72; --gold2:#ffd24a; --text:#eef2f8; --dim:#9aa6bb; --sky:#7fe6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: "Malgun Gothic", "Galmuri11", sans-serif; }
  #wrap { position:relative; width:960px; max-width:100vw; aspect-ratio: 960 / 544; margin: 12px auto 0; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; background:#000; }   /* 게임이 화면 픽셀 밀도로 직접 그린다 (pixelated 로 늘리면 배율 125%·150% 에서 자글거림) */
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:16px;
             background: radial-gradient(ellipse at 50% 45%, rgba(20,28,56,0.55), rgba(6,8,18,0.88)); backdrop-filter: blur(3px); }
  .overlay.hidden { display:none; }
  /* 시작 화면: 1-1 숲 그림을 어둡게 깔고 그 위에 */
  #title { background: linear-gradient(180deg, rgba(6,10,24,0.35), rgba(6,10,24,0.82) 70%), url(assets/bg-1-1.png) center/cover; backdrop-filter:none; gap:8px; }
  #select { background: linear-gradient(180deg, rgba(6,10,24,0.6), rgba(6,10,24,0.88)), url(assets/bg-1-1.png) center/cover; backdrop-filter:none; }
  /* 판: 모서리를 깎은 남색 판, 청동 바깥선 + 금 안쪽선 */
  .menu { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:320px; }
  /* 제목 글씨: PERFECT 글자처럼 굵은 기울임, 금빛 그러데이션, 어두운 테두리와 빛 */
  @font-face { font-family:'Jersey10'; src:url('assets/fonts/Jersey10.ttf'); }   /* 제목 글꼴: Jersey 10 (SIL OFL, assets/fonts/OFL-Jersey10.txt). 2026-11-24 사용자가 후보 셋 가운데 고름 */
  .logo { margin:0; font-family:'Jersey10', 'Malgun Gothic', sans-serif; font-size:92px; font-weight:400; letter-spacing:5px; line-height:1;
          background: linear-gradient(180deg, #fffbe0 0%, #ffd24a 50%, #ff9a3a 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
          filter: drop-shadow(0 0 0 #4a2600) drop-shadow(2px 0 0 #4a2600) drop-shadow(-2px 0 0 #4a2600) drop-shadow(0 3px 0 #4a2600) drop-shadow(0 0 14px rgba(255,200,80,0.6)); }
  h2 { margin:0 0 4px; font-size:30px; font-weight:900; font-style:italic; letter-spacing:2px;
       background: linear-gradient(180deg, #f4ffff, #7fe6ff 60%, #3fa8e0); -webkit-background-clip:text; background-clip:text; color:transparent;
       filter: drop-shadow(0 2px 0 #0b3550) drop-shadow(0 0 8px rgba(120,220,255,0.5)); }
  .sub { color:#cfd6e6; font-size:14px; text-shadow:0 1px 0 #000; }
  .notice { color:var(--dim); font-size:11px; max-width:640px; line-height:1.5; text-shadow:0 1px 0 #000; }
  /* 세 캐릭터: 수정 받침 위에 서서 숨쉬기 */
  .trio { display:flex; gap:34px; align-items:flex-end; height:156px; margin:0 0 18px; }   /* 큰 그림(약 200 픽셀)을 줄여 써서 선명하게 (2026-11-24) */
  .trio div { position:relative; display:flex; flex-direction:column; align-items:center; }
  .trio img { height:150px; animation: breathe 1.6s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 0 6px rgba(127,230,255,0.35)); }
  .trio div:nth-child(2) img { animation-delay: .5s; } .trio div:nth-child(3) img { animation-delay: 1s; }
  .trio div::after { content:''; width:70px; height:10px; margin-top:-4px; border-radius:50%; background: radial-gradient(ellipse, rgba(127,230,255,0.7), rgba(127,230,255,0) 70%); }
  .trio span { position:absolute; bottom:-18px; font-size:12px; font-weight:700; color:var(--gold); text-shadow:0 1px 0 #000; white-space:nowrap; }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }
  /* 조작 안내: 키 모양 */
  .keys { display:grid; grid-template-columns: auto auto auto; gap:6px 18px; font-size:13px; text-align:left; margin-top:12px; }
  .keys span { white-space:nowrap; }
  .keys b { display:inline-block; min-width:22px; padding:1px 6px; margin-right:5px; font-size:11px; color:#fff; text-align:center;
            background: linear-gradient(180deg, #4a5280, #2b3150); border:1px solid var(--gold); border-bottom-width:3px; border-radius:3px; }
  /* 2026-11-24 사용자 UI 에셋 (assets/ui/): 판은 숲 장식 틀 (9조각으로 늘림), 버튼은 금 테두리 육각 버튼 (보통·고름·잠김 세 장) */
  .panel { position:relative; border-style:solid; border-color:transparent; border-width:40px 46px 56px; border-image: url(assets/ui/panel-wide.png) 60 70 92 70 fill / 40px 46px 56px stretch;   /* 옆의 가운데는 무늬 없는 테두리만 늘어나게 자름 */ padding:0 8px; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.55)); }
  .btn { position:relative; min-width:300px; height:46px; padding:0 52px; border:0; background:none; border-image: url(assets/ui/btn-long.png) 0 70 fill / 0 30px stretch;
         color:#dfe5f2; font:inherit; font-size:17px; font-weight:700; cursor:pointer; text-shadow:0 1px 0 #000; }
  .btn.sel { color:#fff6d0; border-image-source: url(assets/ui/btn-long-sel.png); text-shadow:0 0 8px rgba(255,210,90,0.8), 0 1px 0 #000; }
  .btn.locked { color:#7d8498; border-image-source: url(assets/ui/btn-long-off.png); }
  #select .btn { width:400px; }   /* 스테이지 버튼은 폭을 맞춤 */
  .stars { color:var(--gold2); letter-spacing:4px; text-shadow:0 0 10px rgba(255,210,74,0.6), 0 2px 0 #4a2600; }
  .stars .off { color:#3a3f55; text-shadow:none; }
  #clear-stars, #gc-stars { font-size:36px; }
  .hint { color:var(--dim); font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="544"></canvas>

  <div id="title" class="overlay">
    <h1 class="logo">CHAIN ECHO</h1>
    <div class="trio">
      <div><img src="assets/char/red-big.png" alt="플레아"><span>A 플레아</span></div>
      <div><img src="assets/char/blue-big.png" alt="오필리아"><span>S 오필리아</span></div>
      <div><img src="assets/char/wind-big.png" alt="클로에"><span>D 클로에</span></div>
    </div>
    <div class="panel menu">
      <div class="keys">
        <span><b>← →</b>이동</span><span><b>Space</b>점프</span><span><b>↑</b>위쪽 (오필리아)</span>
        <span><b>A S D</b>태그 (지금 캐릭터면 자기 기술)</span><span><b>F</b>기본 공격</span><span><b>Shift</b>이동폼 ↔ 공격폼</span>
        <span><b>E</b>체인 에코</span><span><b>Esc</b>일시정지</span><span></span>
      </div>
      <button class="btn" id="title-start">게임 시작</button>
    </div>
    <div class="notice">몬길: 스타다이브 캐릭터 콘셉트를 차용한 IP 활용 게임, 비영리 창작 게임입니다.</div>
  </div>

  <div id="select" class="overlay hidden">
    <div class="panel menu">
      <h2>스테이지</h2>
      <button class="btn" id="st-0"></button>
      <button class="btn" id="st-1"></button>
      <button class="btn" id="st-2"></button>
      <button class="btn" id="st-3"></button>
      <button class="btn" id="st-4"></button>
      <div class="hint">↑ ↓ 로 고르고 Enter. 앞 스테이지를 깨야 다음이 열린다. 별: 깨기 · 안 맞고 깨기 · 숨겨진 보물</div>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel menu">
      <h2>일시정지</h2>
      <button class="btn" id="pause-resume">계속하기</button>
      <button class="btn" id="pause-restart">다시 하기</button>
      <button class="btn" id="pause-list">목록</button>
    </div>
  </div>

  <div id="clear" class="overlay hidden">
    <div class="panel menu">
      <h2 id="clear-title">클리어!</h2>
      <div id="clear-stars" class="stars"></div>
      <div id="clear-info" class="sub"></div>
      <button class="btn" id="clear-next">다음 스테이지</button>
      <button class="btn" id="clear-list">목록</button>
    </div>
  </div>

  <div id="gameclear" class="overlay hidden">
    <h1 class="logo">GAME CLEAR</h1>
    <div class="panel menu">
      <div id="gc-stars" class="stars"></div>
      <div id="gc-info" class="sub"></div>
      <button class="btn" id="gc-list">목록</button>
      <button class="btn" id="gc-title">처음 화면</button>
    </div>
  </div>
</div>
<script src="./game.js?v=48"></script>   <!-- ?v= 를 바꾸면 브라우저가 예전 파일을 쓰지 않고 새로 읽는다 -->
</body>
</html>
